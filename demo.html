<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo | FYP-26-S2-27</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .video-card:hover {
      border-color: var(--border2);
    }

    .video-embed-wrap {
      position: relative;
      padding-bottom: 56.25%;
      /* 16:9 */
      height: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }

    .video-embed-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .demo-caption {
      padding: 1rem 1.125rem;
    }

    .demo-caption-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 0.1em;
      margin-bottom: 3px;
    }

    .demo-caption-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3px;
    }

    .demo-caption-sub {
      font-size: 13px;
      color: var(--text2);
    }

    .how-it-works {
      margin-top: 3.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
    }

    .how-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .how-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem;
    }

    .how-step-num {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.4;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .how-step-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    .how-step-desc {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.7;
    }

    .add-note {
      margin-top: 1.25rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      line-height: 1.8;
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      .how-steps {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

          target="_blank">Docs ↗</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <div class="page-eyebrow">Demo</div>
      <h1 class="page-title">Application Demo</h1>
      <p class="page-subtitle">The live prediction interface built with React and FastAPI, showing stock selection,
        sector-based XGBoost inference, and Buy/Hold/Sell prediction results.</p>
